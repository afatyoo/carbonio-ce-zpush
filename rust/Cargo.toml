[package]
name = "carbonio-ce-zpush"
version = "1.0.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls-manual-roots", "multipart"] }
rustls = "0.23.19"
rustls-pki-types = "1.10.1"
rustls-pemfile = "2.2.0"
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
tokio = { version = "1.41.1", features = ["full"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
anyhow = "1.0.93"
axum = "0.7.9"
base64 = "0.22.1"
